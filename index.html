<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>MLTV - CS2 Рейтинг</title>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: #0a0a0f;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 10px;
      padding-bottom: 30px;
    }

    .header {
      background: #1a1a2e;
      padding: 15px;
      border-radius: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .logo-text {
      font-size: 24px;
      font-weight: bold;
      color: #ff9500;
      cursor: pointer;
    }

    button {
      background: #ff9500;
      color: #000;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      margin: 3px;
      min-height: 44px;
    }

    button:active { background: #cc7700; }
    button.red { background: #cc0000; color: #fff; }
    button.green { background: #00aa00; color: #fff; }
    button.blue { background: #0066cc; color: #fff; }

    .tabs {
      display: flex;
      gap: 5px;
      margin-bottom: 15px;
    }

    .tabs button {
      flex: 1;
      background: #1a1a2e;
      color: #aaa;
    }

    .tabs button.active-tab {
      background: #ff9500;
      color: #000;
    }

    .page { display: none; }
    .page.show-page { display: block; }

    .team-row {
      background: #1a1a2e;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .rank-num {
      width: 35px;
      height: 35px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      background: #333;
      flex-shrink: 0;
    }

    .team-row:nth-child(1) .rank-num { background: #ff9500; color: #000; }
    .team-row:nth-child(2) .rank-num { background: #c0c0c0; color: #000; }
    .team-row:nth-child(3) .rank-num { background: #cd7f32; color: #000; }

    .team-logo {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: #333;
      flex-shrink: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .team-logo img { width: 100%; height: 100%; object-fit: cover; }

    .team-logo-small {
      width: 30px;
      height: 30px;
      border-radius: 6px;
      background: #333;
      flex-shrink: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .team-logo-small img { width: 100%; height: 100%; object-fit: cover; }

    .team-info { flex: 1; min-width: 0; }
    .team-name-text { font-weight: bold; font-size: 16px; }
    .team-region-text { font-size: 12px; color: #999; }
    .team-points-text { color: #ff9500; font-weight: bold; flex-shrink: 0; }

    .login-box {
      background: #1a1a2e;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
    }

    .login-box input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      background: #0a0a1f;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      font-size: 16px;
      text-align: center;
    }

    .admin-panel {
      background: #1a1a2e;
      padding: 15px;
      border-radius: 15px;
      margin-top: 15px;
      border: 2px solid #ff9500;
    }

    h3 { color: #ff9500; margin: 15px 0 10px 0; }
    h4 { color: #ddd; margin: 12px 0 6px 0; }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      margin: 5px 0;
      background: #0a0a1f;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      font-size: 16px;
    }

    .row-inputs { display: flex; gap: 5px; }
    .row-inputs input { flex: 1; }

    .player-box {
      background: #0a0a1f;
      padding: 10px;
      border-radius: 10px;
      margin: 8px 0;
      cursor: pointer;
    }

    .player-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .player-photo-box, .player-photo-static {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #333;
      flex-shrink: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .player-photo-box { cursor: pointer; }
    .player-photo-box img, .player-photo-static img {
      width: 100%; height: 100%; object-fit: cover;
    }

    .match-card {
      background: #1a1a2e;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 8px;
    }

    .match-teams {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 8px 0;
    }

    .match-team {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
      font-size: 14px;
    }

    .match-team-right {
      justify-content: flex-end;
      text-align: right;
    }

    .match-score-center {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      margin: 5px 0;
    }

    .tournament-card {
      background: #1a1a2e;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 8px;
      cursor: pointer;
    }

    .back-link {
      color: #ff9500;
      font-size: 16px;
      margin-bottom: 15px;
      display: inline-block;
      cursor: pointer;
    }

    .logo-big {
      width: 80px;
      height: 80px;
      border-radius: 15px;
      background: #333;
      margin: 0 auto 10px auto;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-big img { width: 100%; height: 100%; object-fit: cover; }

    input[type="file"] { display: none; }

    .hint-text { font-size: 11px; color: #888; text-align: center; margin: 5px 0; }

    .admin-player-row {
      background: #0a0a1f;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 8px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .logout-btn {
      background: #555;
      color: #fff;
      font-size: 12px;
      padding: 8px 12px;
      min-height: auto;
    }

    .admin-logo-preview {
      width: 60px;
      height: 60px;
      border-radius: 12px;
      background: #333;
      margin: 10px auto;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .admin-logo-preview img { width: 100%; height: 100%; object-fit: cover; }

    .stats-table {
      width: 100%;
      border-collapse: collapse;
      margin: 10px 0;
      font-size: 13px;
    }

    .stats-table th, .stats-table td {
      padding: 6px 8px;
      border: 1px solid #333;
      text-align: center;
    }

    .stats-table th { background: #1a1a2e; color: #ff9500; }

    .transfer-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      margin: 2px;
    }

    .transfer-in { background: #1a3a1a; color: #4caf50; }
    .transfer-out { background: #3a1a1a; color: #f44336; }

    .bracket {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 10px 0;
    }

    .bracket-round {
      background: #1a1a2e;
      padding: 10px;
      border-radius: 10px;
    }

    .bracket-round h4 { color: #ff9500; margin-bottom: 8px; font-size: 14px; }

    .bracket-match {
      background: #0a0a1f;
      padding: 8px;
      border-radius: 8px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }

    .bracket-team {
      flex: 1;
      padding: 6px;
      border-radius: 6px;
      text-align: center;
      font-weight: bold;
    }

    .bracket-winner { background: #1a3a1a; border: 1px solid #4caf50; }
    .bracket-loser { background: #3a1a1a; border: 1px solid #f44336; }

    .bracket-score {
      font-weight: bold;
      color: #ff9500;
      min-width: 30px;
      text-align: center;
    }

    .group-table {
      width: 100%;
      border-collapse: collapse;
      margin: 10px 0;
      font-size: 12px;
    }

    .group-table th, .group-table td {
      padding: 6px;
      border: 1px solid #333;
      text-align: center;
    }

    .group-table th { background: #1a1a2e; color: #ff9500; }
  </style>
</head>

  <script>
    // ========== НАСТРОЙКИ ==========
    var ADMIN_PASSWORD = 'mltv2026';
    
    var SUPABASE_URL = 'https://thlsltelqegxzpoptldd.supabase.co';
    var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRobHNsdGVscWVneHpwb3B0bGRkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0MjExNDcsImV4cCI6MjEwMDk5NzE0N30.RXOkkQxZ8CWkmJZZRZvXi0J4IVyLwG5LCIpi3TXj8z0';
    
    var DB = { teams: [], matches: [], tournaments: [], transfers: [] };
    var isAdmin = false;
    var currentUpload = null;
    var DB_LOADED = false;

    function setDefaultData() {
      DB.teams = [
        { name:"Falcons", region:"EU", points:1000, logo:"", players:[] },
        { name:"Vitality", region:"EU", points:982, logo:"", players:[] },
        { name:"Spirit", region:"EU", points:965, logo:"", players:[] },
        { name:"FURIA", region:"SA", points:912, logo:"", players:[] },
        { name:"Natus Vincere", region:"EU", points:894, logo:"", players:[] },
        { name:"9z", region:"SA", points:870, logo:"", players:[] },
        { name:"BetBoom", region:"EU", points:845, logo:"", players:[] },
        { name:"Aurora", region:"EU", points:822, logo:"", players:[] },
        { name:"G2", region:"EU", points:798, logo:"", players:[] },
        { name:"MOUZ", region:"EU", points:775, logo:"", players:[] },
        { name:"Legacy", region:"NA", points:752, logo:"", players:[] },
        { name:"The MongolZ", region:"AS", points:731, logo:"", players:[] },
        { name:"FaZe", region:"EU", points:708, logo:"", players:[] },
        { name:"FUT", region:"EU", points:684, logo:"", players:[] },
        { name:"Astralis", region:"EU", points:661, logo:"", players:[] },
        { name:"B8", region:"EU", points:642, logo:"", players:[] },
        { name:"PARIVISION", region:"EU", points:620, logo:"", players:[] },
        { name:"paiN", region:"SA", points:598, logo:"", players:[] },
        { name:"GamerLegion", region:"EU", points:572, logo:"", players:[] },
        { name:"Liquid", region:"NA", points:555, logo:"", players:[] }
      ];
      DB.matches = [];
      DB.tournaments = [];
      DB.transfers = [];
    }

    // Загрузка из Supabase
    async function loadFromSupabase() {
      try {
        var response = await fetch(SUPABASE_URL + '/rest/v1/data?id=eq.1', {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
        });
        
        if (response.ok) {
          var data = await response.json();
          if (data && data.length > 0 && data[0].content) {
            try {
              var parsed = JSON.parse(data[0].content);
              if (parsed && parsed.teams && Array.isArray(parsed.teams) && parsed.teams.length > 0) {
                DB = parsed;
                if (!DB.transfers) DB.transfers = [];
                if (!DB.matches) DB.matches = [];
                if (!DB.tournaments) DB.tournaments = [];
                console.log('Данные загружены из Supabase. Команд: ' + DB.teams.length);
                DB_LOADED = true;
                return;
              }
            } catch(parseError) {
              console.error('Ошибка парсинга данных:', parseError);
            }
          }
        }
        
        // Если Supabase пустой или ошибка - пробуем localStorage
        loadFromLocalStorage();
      } catch(e) {
        console.error('Ошибка подключения к Supabase:', e);
        loadFromLocalStorage();
      }
    }

    function loadFromLocalStorage() {
      var saved = localStorage.getItem('mltv_backup');
      if (saved) {
        try {
          var data = JSON.parse(saved);
          if (data && data.teams && Array.isArray(data.teams) && data.teams.length > 0) {
            DB = data;
            if (!DB.transfers) DB.transfers = [];
            if (!DB.matches) DB.matches = [];
            if (!DB.tournaments) DB.tournaments = [];
            console.log('Данные загружены из localStorage. Команд: ' + DB.teams.length);
            DB_LOADED = true;
            return;
          }
        } catch(e) {
          console.error('Ошибка парсинга localStorage:', e);
        }
      }
      
      // Если вообще ничего нет - создаём по умолчанию
      setDefaultData();
      saveToLocalStorage();
      console.log('Созданы данные по умолчанию');
      DB_LOADED = true;
    }

    // Сохранение
    async function saveDB() {
      // Всегда сохраняем в localStorage
      saveToLocalStorage();
      
      // Пробуем сохранить в Supabase
      if (isAdmin) {
        try {
          var content = JSON.stringify(DB);
          await fetch(SUPABASE_URL + '/rest/v1/data?id=eq.1', {
            method: 'PATCH',
            headers: {
              'apikey': SUPABASE_KEY,
              'Authorization': 'Bearer ' + SUPABASE_KEY,
              'Content-Type': 'application/json',
              'Prefer': 'return=minimal'
            },
            body: JSON.stringify({ content: content })
          });
          console.log('Сохранено в Supabase');
        } catch(e) {
          console.error('Ошибка сохранения в Supabase:', e);
        }
      }
    }

    function saveToLocalStorage() {
      try {
        localStorage.setItem('mltv_backup', JSON.stringify(DB));
      } catch(e) {
        console.error('Ошибка сохранения в localStorage:', e);
      }
    }

    // Автообновление
    setInterval(async function() {
      try {
        var response = await fetch(SUPABASE_URL + '/rest/v1/data?id=eq.1', {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
        });
        if (response.ok) {
          var data = await response.json();
          if (data && data.length > 0 && data[0].content) {
            var parsed = JSON.parse(data[0].content);
            if (parsed && parsed.teams && JSON.stringify(parsed) !== JSON.stringify(DB)) {
              DB = parsed;
              if (!DB.transfers) DB.transfers = [];
              if (!DB.matches) DB.matches = [];
              if (!DB.tournaments) DB.tournaments = [];
                        saveToLocalStorage();
          refreshCurrentView();
        }
      }
    }
  } catch(e) {}
}, 5000);

function refreshCurrentView() {
  if (document.getElementById('page-rating').classList.contains('show-page')) buildRatingList();
  if (document.getElementById('page-matches').classList.contains('show-page')) buildMatchesList();
  if (document.getElementById('page-tournaments').classList.contains('show-page')) buildTournamentsList();
  if (document.getElementById('page-stats').classList.contains('show-page')) buildStatsPage();
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function logoHTML(team, size) {
  if (team && team.logo && team.logo.length > 100) {
    return '<img src="' + team.logo + '" style="width:100%;height:100%;object-fit:cover;">';
  }
  var initials = (team && team.name) ? team.name.substring(0,2).toUpperCase() : '??';
  var fontSize = (size === 'big') ? '30px' : (size === 'small') ? '12px' : '14px';
  return '<span style="font-size:' + fontSize + ';font-weight:bold;">' + esc(initials) + '</span>';
}

function findTeam(name) {
  for (var i = 0; i < DB.teams.length; i++) {
    if (DB.teams[i].name === name) return DB.teams[i];
  }
  return null;
}

function playerPhotoHTML(player, clickable, teamIdx, playerIdx) {
  var boxClass = clickable ? 'player-photo-box' : 'player-photo-static';
  var onclickAttr = clickable ? ' onclick="uploadPlayerPhoto(' + teamIdx + ',' + playerIdx + ')"' : '';
  
  if (player && player.photo && player.photo.length > 100) {
    return '<div class="' + boxClass + '"' + onclickAttr + '><img src="' + player.photo + '" style="width:100%;height:100%;object-fit:cover;"></div>';
  }
  var initials = (player && player.nick) ? player.nick[0].toUpperCase() : '?';
  return '<div class="' + boxClass + '"' + onclickAttr + '><span style="font-size:20px;">' + esc(initials) + '</span></div>';
}

function getPlayerStats(nick) {
  var stats = { matches: 0, totalKills: 0, totalDeaths: 0, totalAssists: 0, kd: '0.00', rating: '0.00' };
  
  for (var m = 0; m < DB.matches.length; m++) {
    var match = DB.matches[m];
    if (match.stats) {
      for (var s = 0; s < match.stats.length; s++) {
        if (match.stats[s].playerNick === nick) {
          stats.matches++;
          stats.totalKills += parseInt(match.stats[s].kills) || 0;
          stats.totalDeaths += parseInt(match.stats[s].deaths) || 0;
          stats.totalAssists += parseInt(match.stats[s].assists) || 0;
        }
      }
    }
  }

  if (stats.matches > 0) {
    stats.kd = (stats.totalKills / Math.max(1, stats.totalDeaths)).toFixed(2);
    var rating = (stats.totalKills + 0.7 * stats.totalAssists - 0.3 * stats.totalDeaths) / stats.matches / 2;
    stats.rating = Math.max(0, rating).toFixed(2);
  }
  return stats;
}

async function addMatchStat(matchIdx) {
  if (!isAdmin) return;
  var playerNick = document.getElementById('stats-player-select').value;
  var kills = parseInt(document.getElementById('stats-kills').value) || 0;
  var deaths = parseInt(document.getElementById('stats-deaths').value) || 0;
  var assists = parseInt(document.getElementById('stats-assists').value) || 0;
  
  if (!playerNick) { alert('Выберите игрока!'); return; }
  
  var kd = deaths > 0 ? (kills / deaths).toFixed(2) : kills.toFixed(2);
  
  if (!DB.matches[matchIdx].stats) DB.matches[matchIdx].stats = [];
  
  var existingIdx = -1;
  for (var s = 0; s < DB.matches[matchIdx].stats.length; s++) {
    if (DB.matches[matchIdx].stats[s].playerNick === playerNick) { existingIdx = s; break; }
  }
  
  var statEntry = { playerNick: playerNick, kills: kills, deaths: deaths, assists: assists, kd: kd };
  
  if (existingIdx >= 0) {
    DB.matches[matchIdx].stats[existingIdx] = statEntry;
  } else {
    DB.matches[matchIdx].stats.push(statEntry);
  }
  
  await saveDB();
  buildMatchStatsForm(matchIdx);
  buildMatchesList();
  alert('Статистика сохранена!');
}

async function clearMatchStats(matchIdx) {
  if (!isAdmin) return;
  if (confirm('Очистить статистику матча?')) {
    DB.matches[matchIdx].stats = [];
    await saveDB();
    buildMatchStatsForm(matchIdx);
    buildMatchesList();
  }
}

      var teamOpts = '<option value="">Выберите команду...</option>';
      for (var t = 0; t < DB.teams.length; t++) {
        teamOpts += '<option value="' + esc(DB.teams[t].name) + '">' + esc(DB.teams[t].name) + '</option>';
      }
      fromSelect.innerHTML = teamOpts;
      toSelect.innerHTML = teamOpts;
    }

    async function addTransfer() {
      if (!isAdmin) return;
      var playerSelect = document.getElementById('transfer-player-select');
      var fromTeam = document.getElementById('transfer-from-team').value;
      var toTeam = document.getElementById('transfer-to-team').value;
      var date = document.getElementById('transfer-date').value;
      
      if (!playerSelect.value || !fromTeam || !toTeam) { alert('Заполните все поля!'); return; }
      
      var parts = playerSelect.value.split('|||');
      var playerNick = parts[0];
      
      DB.transfers.push({ playerNick: playerNick, fromTeam: fromTeam, toTeam: toTeam, date: date });
      await saveDB();
      updateTransferSelects();
      alert('Трансфер добавлен!');
    }

    function updateMatchSelects() {
      if (!isAdmin) return;
      var opts = '';
      for (var i = 0; i < DB.teams.length; i++) {
        opts += '<option>' + esc(DB.teams[i].name) + '</option>';
      }
      document.getElementById('match-team1').innerHTML = opts;
      document.getElementById('match-team2').innerHTML = opts;
    }

    async function addNewTeam() {
      if (!isAdmin) return;
      var name = document.getElementById('add-name').value.trim();
      if (!name) { alert('Введите название!'); return; }
      
      DB.teams.push({
        name: name,
        region: document.getElementById('add-region').value.trim() || 'EU',
        points: parseInt(document.getElementById('add-points').value) || 500,
        logo: '',
        players: []
      });
      
      document.getElementById('add-name').value = '';
      await saveDB();
      refreshAllAdmin();
      alert('Команда ' + name + ' добавлена!');
    }

    async function addNewMatch() {
      if (!isAdmin) return;
      DB.matches.push({
        team1: document.getElementById('match-team1').value,
        team2: document.getElementById('match-team2').value,
        score: document.getElementById('match-score-input').value.trim() || '0:0',
        tournament: document.getElementById('match-tour-input').value.trim() || 'Турнир',
        date: new Date().toLocaleDateString('ru-RU'),
        stats: []
      });
      await saveDB();
      buildMatchesList();
      updateStatsMatchSelect();
      alert('Матч добавлен!');
    }

    async function addNewTournament() {
      if (!isAdmin) return;
      var name = document.getElementById('tour-name-input').value.trim();
      if (!name) { alert('Введите название!'); return; }
      
      DB.tournaments.push({
        name: name,
        start: document.getElementById('tour-start-input').value,
        end: document.getElementById('tour-end-input').value,
        type: document.getElementById('tour-type-select').value
      });
      
      document.getElementById('tour-name-input').value = '';
      await saveDB();
      buildTournamentsList();
      alert('Турнир создан!');
    }

    // ========== ЗАПУСК ==========
    async function init() {
      if (localStorage.getItem('mltv_is_admin') === 'true') {
        isAdmin = true;
      }
      
      await loadFromSupabase();
      
      buildRatingList();
      buildMatchesList();
      buildTournamentsList();
    }

    init();
  </script>
</body>
</html>
