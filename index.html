<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>MLTV - CS2 Рейтинг, Матчи, Турниры, Статистика</title>
  <style>
    :root {
      --bg: #0b0b10;
      --bg2: #12121a;
      --bg3: #1a1a26;
      --bg4: #222230;
      --orange: #fca311;
      --orange2: #ff8c00;
      --text: #e8e8ec;
      --text2: #9a9aa8;
      --text3: #6b6b7a;
      --border: #252535;
      --border2: #333348;
      --win: #4caf50;
      --win2: #2e7d32;
      --lose: #f44336;
      --lose2: #c62828;
      --blue: #2196F3;
      --gold: #ffd700;
      --silver: #c0c0c0;
      --bronze: #cd7f32;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      -webkit-tap-highlight-color: transparent;
      padding-bottom: 50px;
    }

    /* Скроллбар */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

    /* Шапка */
    .topbar {
      background: #0a0a12;
      border-bottom: 2px solid #1a1a2a;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(10px);
    }

    .logo-main {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 2px;
      cursor: pointer;
      color: #fff;
      font-style: italic;
    }
    .logo-main .accent { color: var(--orange); }
    .logo-main .cs2 { font-size: 11px; color: var(--text2); margin-left: 2px; font-style: normal; }

    .topbar-right { display: flex; gap: 8px; align-items: center; }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      font-weight: 600;
      font-size: 11px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.95); }
    .btn-orange { background: var(--orange); color: #000; }
    .btn-orange:hover { background: #e69500; }
    .btn-outline { background: transparent; border: 1px solid var(--border2); color: var(--text2); }
    .btn-red { background: var(--lose2); color: #fff; }
    .btn-green { background: var(--win2); color: #fff; }
    .btn-blue { background: var(--blue); color: #fff; }
    .btn-sm { padding: 5px 10px; font-size: 10px; }
    .btn-xs { padding: 3px 7px; font-size: 9px; border-radius: 3px; }

    /* Навигация */
    .navbar {
      background: var(--bg2);
      display: flex;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .navbar button {
      flex: 1;
      padding: 14px 20px;
      background: none;
      border: none;
      color: var(--text2);
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      cursor: pointer;
      white-space: nowrap;
      min-width: 70px;
      transition: all 0.2s;
      position: relative;
    }
    .navbar button.active {
      color: #fff;
      background: rgba(252,163,17,0.05);
    }
    .navbar button.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 3px;
      background: var(--orange);
      border-radius: 2px 2px 0 0;
    }

    /* Контент */
    .page { display: none; padding: 16px 12px; }
    .page.active { display: block; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    .container { max-width: 700px; margin: 0 auto; }

    /* Заголовки секций */
    .section-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text2);
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title .icon { font-size: 16px; }
    .section-title .count {
      margin-left: auto;
      font-size: 10px;
      background: var(--bg4);
      padding: 3px 10px;
      border-radius: 12px;
      color: var(--text3);
    }

    /* Рейтинг */
    .ranking-card {
      background: var(--bg2);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      margin-bottom: 10px;
    }
    .ranking-header {
      display: grid;
      grid-template-columns: 48px 1fr 80px;
      padding: 10px 16px;
      background: var(--bg3);
      font-size: 10px;
      color: var(--text3);
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .team-row {
      display: grid;
      grid-template-columns: 48px 1fr 80px;
      padding: 10px 16px;
      align-items: center;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: all 0.15s;
    }
    .team-row:hover { background: rgba(252,163,17,0.03); }
    .team-row:last-child { border-bottom: none; }
    .team-row:active { background: rgba(252,163,17,0.08); }

    .rank { font-weight: 700; font-size: 13px; color: var(--text3); }
    .team-row:nth-child(1) .rank { color: var(--gold); font-size: 15px; }
    .team-row:nth-child(2) .rank { color: var(--silver); font-size: 14px; }
    .team-row:nth-child(3) .rank { color: var(--bronze); font-size: 14px; }

    .rank-change {
      font-size: 9px;
      margin-left: 3px;
      font-weight: 600;
    }
    .rank-up { color: var(--win); }
    .rank-down { color: var(--lose); }
    .rank-same { color: var(--text3); }

    .team-cell { display: flex; align-items: center; gap: 10px; }
    .team-logo {
      width: 34px;
      height: 34px;
      border-radius: 6px;
      background: var(--bg4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 11px;
      overflow: hidden;
      flex-shrink: 0;
      border: 1px solid var(--border2);
    }
    .team-logo img { width: 100%; height: 100%; object-fit: cover; }
    .team-logo.lg { width: 28px; height: 28px; border-radius: 4px; }
    .team-name { font-weight: 600; font-size: 13px; }
    .team-region { font-size: 10px; color: var(--text3); }
    .points { text-align: right; font-weight: 700; color: var(--orange); font-size: 13px; }

    /* Матчи */
    .match-card {
      background: var(--bg2);
      border-radius: 8px;
      margin-bottom: 10px;
      cursor: pointer;
      border: 1px solid var(--border);
      transition: all 0.15s;
      overflow: hidden;
    }
    .match-card:hover { border-color: var(--border2); }
    .match-card:active { background: var(--bg3); }

    .match-header {
      padding: 8px 14px;
      font-size: 10px;
      color: var(--text3);
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.2);
    }
    .match-header .tournament-tag {
      color: var(--orange);
      font-weight: 600;
    }
    .match-live {
      background: var(--lose);
      color: #fff;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 9px;
      font-weight: 700;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }

    .match-body {
      padding: 14px;
      display: grid;
      grid-template-columns: 1fr 70px 1fr;
      align-items: center;
      gap: 10px;
    }
    .match-team {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 14px;
    }
    .match-team.right { justify-content: flex-end; text-align: right; }
    .match-team .team-name { font-size: 13px; }

    .match-score-box {
      text-align: center;
      background: var(--bg4);
      border-radius: 6px;
      padding: 6px 8px;
    }
    .match-score { font-size: 18px; font-weight: 700; color: #fff; }
    .match-bestof { font-size: 9px; color: var(--text3); }

    .match-footer {
      padding: 6px 14px;
      font-size: 10px;
      color: var(--text3);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
    }

    /* Турниры */
    .tournament-card {
      background: var(--bg2);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 10px;
      cursor: pointer;
      border-left: 4px solid var(--orange);
      border: 1px solid var(--border);
      transition: all 0.15s;
    }
    .tournament-card:hover { border-color: var(--orange); }
    .tournament-card h3 { font-size: 15px; color: #fff; }
    .tournament-card .meta { font-size: 11px; color: var(--text3); margin-top: 4px; }
    .tournament-card .teams-count {
      margin-top: 8px;
      font-size: 10px;
      color: var(--orange);
      font-weight: 600;
    }

    /* Страница матча */
    .match-detail-header {
      text-align: center;
      padding: 20px 0;
    }
    .match-detail-header .vs {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin: 10px 0;
    }
    .match-detail-header .team-block {
      text-align: center;
    }
    .match-detail-header .score-big {
      font-size: 42px;
      font-weight: 900;
      color: #fff;
    }

    .stats-section {
      background: var(--bg2);
      border-radius: 8px;
      border: 1px solid var(--border);
      overflow: hidden;
      margin-top: 10px;
    }
    .stats-section h3 {
      padding: 12px 14px;
      font-size: 12px;
      text-transform: uppercase;
      color: var(--orange);
      background: var(--bg3);
      border-bottom: 1px solid var(--border);
    }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; }
    .stats-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }
    .stats-table th {
      background: var(--bg4);
      padding: 6px 8px;
      text-align: center;
      font-weight: 600;
      color: var(--text2);
      font-size: 10px;
      text-transform: uppercase;
    }
    .stats-table td {
      padding: 6px 8px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }
    .stats-table tr:hover td { background: rgba(252,163,17,0.03); }
    .highlight { color: var(--orange); font-weight: 700; }

    /* Сетка */
    .bracket-container { display: flex; flex-direction: column; gap: 8px; }
    .bracket-round {
      background: var(--bg2);
      border-radius: 6px;
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .bracket-round h4 {
      padding: 10px 14px;
      font-size: 11px;
      text-transform: uppercase;
      background: var(--bg3);
      color: var(--orange);
      border-bottom: 1px solid var(--border);
    }
    .bracket-match {
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
    }
    .bracket-match:last-child { border-bottom: none; }
    .bracket-team { flex: 1; font-weight: 600; font-size: 12px; }
    .bracket-team.win { color: var(--win); }
    .bracket-team.lose { color: var(--lose); }
    .bracket-vs { font-weight: 700; color: var(--orange); font-size: 12px; }

    /* Группы */
    .groups-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .group-box {
      background: var(--bg2);
      border-radius: 6px;
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .group-box h4 {
      padding: 8px 12px;
      font-size: 11px;
      text-transform: uppercase;
      background: var(--bg3);
      color: var(--orange);
    }
    .group-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 10px;
    }
    .group-table th {
      background: var(--bg4);
      padding: 5px 6px;
      text-align: center;
      color: var(--text3);
    }
    .group-table td {
      padding: 5px 6px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    /* Профиль игрока */
    .player-profile {
      text-align: center;
      padding: 20px 0;
    }
    .player-avatar-lg {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--bg4);
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 700;
      overflow: hidden;
      border: 3px solid var(--orange);
    }
    .player-avatar-lg img { width: 100%; height: 100%; object-fit: cover; }
    .player-avatar-sm {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--bg4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 12px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .player-avatar-sm img { width: 100%; height: 100%; object-fit: cover; }

    /* Админка */
    .admin-section {
      background: var(--bg2);
      border-radius: 8px;
      border: 1px solid var(--border);
      padding: 14px;
      margin-bottom: 10px;
    }
    .admin-section h4 {
      font-size: 11px;
      text-transform: uppercase;
      color: var(--orange);
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border2);
      border-radius: 5px;
      color: #fff;
      font-size: 12px;
      margin: 3px 0;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--orange);
    }

    .row { display: flex; gap: 6px; }
    .row > * { flex: 1; }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-orange { background: rgba(252,163,17,0.15); color: var(--orange); }
    .badge-green { background: rgba(76,175,80,0.15); color: var(--win); }
    .badge-red { background: rgba(244,67,54,0.15); color: var(--lose); }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text3);
    }
    .empty-state .icon { font-size: 40px; margin-bottom: 10px; }

    .back-link {
      color: var(--orange);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      display: inline-block;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .back-link:hover { color: #fff; }

    @media (max-width: 400px) {
      .match-body { grid-template-columns: 1fr 50px 1fr; gap: 6px; }
      .match-team { font-size: 12px; }
      .match-score { font-size: 16px; }
      .stats-grid { grid-template-columns: 1fr; }
      .groups-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <input type="file" accept="image/*" id="fileInput" style="display:none;">

  <!-- HLTV-style Top Bar -->
  <div class="topbar">
    <div class="logo-main" onclick="go('rating')">M<span class="accent">LTV</span><span class="cs2">CS2</span></div>
    <div class="topbar-right">
      <button class="btn btn-outline btn-sm" onclick="go('matches')">Матчи</button>
      <button class="btn btn-orange btn-sm" onclick="openAdmin()">Админ</button>
    </div>
  </div>

  <!-- Навигация -->
  <div class="navbar">
    <button class="active" data-page="rating">🏆 Рейтинг</button>
    <button data-page="matches">🎮 Матчи</button>
    <button data-page="tournaments">📅 Турниры</button>
    <button data-page="stats">📊 Статистика</button>
  </div>

  <!-- СТРАНИЦЫ -->
  <div id="p-login" class="page">
    <div class="container">
      <div style="max-width:380px;margin:40px auto;background:var(--bg2);padding:30px;border-radius:8px;border:1px solid var(--border);text-align:center;">
        <h3 style="color:var(--orange);margin-bottom:20px;">🔐 Вход в админ-панель</h3>
        <input type="password" id="pw" placeholder="Пароль администратора">
        <button class="btn btn-orange" onclick="login()" style="width:100%;margin-top:10px;">Войти</button>
        <button class="btn btn-outline" onclick="go('rating')" style="width:100%;margin-top:5px;">Отмена</button>
      </div>
    </div>
  </div>

  <div id="p-rating" class="page active"><div class="container" id="rating-list"></div></div>
  <div id="p-matches" class="page"><div class="container" id="matches-list"></div></div>
  <div id="p-tournaments" class="page"><div class="container" id="tournaments-list"></div></div>
  <div id="p-tournament" class="page"><div class="container"><span class="back-link" onclick="go('tournaments')">← К турнирам</span><div id="tournament-view"></div></div></div>
  <div id="p-match" class="page"><div class="container"><span class="back-link" onclick="go('matches')">← К матчам</span><div id="match-view"></div></div></div>
  <div id="p-stats" class="page"><div class="container" id="stats-list"></div></div>
  <div id="p-team" class="page"><div class="container"><span class="back-link" onclick="go('rating')">← К рейтингу</span><div id="team-view"></div></div></div>
  <div id="p-player" class="page"><div class="container"><span class="back-link" onclick="history.back()">← Назад</span><div id="player-view"></div></div></div>
  
  <!-- Админка -->
  <div id="p-admin" class="page">
    <div class="container">
      <div class="admin-section">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <h4 style="border:none;margin:0;padding:0;">🛠️ Админ-панель MLTV</h4>
          <button class="btn btn-red btn-sm" onclick="logout()">Выйти</button>
        </div>
      </div>

      <div class="admin-section">
        <h4>➕ Добавить команду</h4>
        <div class="row"><input id="an" placeholder="Название команды"><input id="ar" placeholder="Регион" value="EU" style="max-width:70px;"></div>
        <input id="ap" type="number" placeholder="Очки рейтинга" value="500">
        <button class="btn btn-orange" onclick="addTeam()" style="width:100%;">Добавить команду</button>
      </div>

      <div class="admin-section">
        <h4>📋 Управление командами <span style="color:var(--text3);font-weight:400;font-size:10px;">(нажми на лого для загрузки)</span></h4>
        <div id="admin-teams"></div>
      </div>

      <div class="admin-section">
        <h4>👥 Составы команд</h4>
        <div id="admin-rosters"></div>
      </div>

      <div class="admin-section">
        <h4>🎮 Добавить матч</h4>
        <div class="row"><select id="mt1"></select><select id="mt2"></select></div>
        <div class="row"><input id="ms" placeholder="Счёт (16:14)"><input id="me" placeholder="Название турнира"></div>
        <button class="btn btn-orange" onclick="addMatch()" style="width:100%;">Добавить матч</button>
      </div>

      <div class="admin-section">
        <h4>📊 Статистика матча (K/D/A)</h4>
        <select id="sm"></select>
        <div id="sf"></div>
      </div>

      <div class="admin-section">
        <h4>📅 Создать турнир с сеткой</h4>
        <input id="tn" placeholder="Название турнира">
        <p style="font-size:10px;color:var(--text3);margin:5px 0;">Участники плей-офф (8 команд):</p>
        <div id="pt">
          <div class="row"><input class="po" placeholder="1"><input class="po" placeholder="2"></div>
          <div class="row"><input class="po" placeholder="3"><input class="po" placeholder="4"></div>
          <div class="row"><input class="po" placeholder="5"><input class="po" placeholder="6"></div>
<div class="row"><input class="po" placeholder="7"><input class="po" placeholder="8"></div>
        </div>
        <button class="btn btn-orange" onclick="addTournament()" style="width:100%;">Создать турнир</button>
      </div>
    </div>
  </div>

  <script>
    // ========== КОНФИГУРАЦИЯ ==========
    var PW = 'mltv2026';
    var SU = 'https://thlsltelqegxzpoptldd.supabase.co';

    function def() {
      DB.teams = [

    async function load() {
      try {
        var r = await fetch(SU + '/rest/v1/data?id=eq.1', { headers: { 'apikey': SK, 'Authorization': 'Bearer ' + SK } });
        if (r.ok) { var d = await r.json(); if (d[0] && d[0].content) { var p = JSON.parse(d[0].content); if (p.teams && p.teams.length > 0) { DB = p; return; } } }
      } catch(e) {}
      var s = localStorage.getItem('mltv_full_v3');
      if (s) { try { var p = JSON.parse(s); if (p.teams && p.teams.length > 0) { DB = p; return; } } catch(e) {} }
      def(); save();
    }

    function save() {
      var j = JSON.stringify(DB); localStorage.setItem('mltv_full_v3', j);
      if (admin) fetch(SU + '/rest/v1/data?id=eq.1', { method: 'PATCH', headers: { 'apikey': SK, 'Authorization': 'Bearer ' + SK, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' }, body: JSON.stringify({ content: j }) }).catch(function(){});
    }

    setInterval(async function() {
      try {
        var r = await fetch(SU + '/rest/v1/data?id=eq.1', { headers: { 'apikey': SK, 'Authorization': 'Bearer ' + SK } });
        if (r.ok) { var d = await r.json(); if (d[0] && d[0].content) { var p = JSON.parse(d[0].content); if (JSON.stringify(p) !== JSON.stringify(DB)) { DB = p; renderPage(); } } }
      } catch(e) {}
    }, 5000);

    function renderPage() {
      if (currentPage === 'rating') rating();

      if (currentPage === 'stats') stats();

    function esc(s) { return s ? String(s).replace(/</g,'&lt;').replace(/>/g,'&gt;') : ''; }
    function ft(n) { for (var i = 0; i < DB.teams.length; i++) if (DB.teams[i].name === n) return DB.teams[i]; return null; }

    function logo(t, sz) {
      if (t && t.logo && t.logo.length > 100) return '<img src="' + t.logo + '" style="width:100%;height:100%;object-fit:cover;">';
      var i = (t && t.name) ? t.name.substring(0,2).toUpperCase() : '??';
      var fs = sz === 'lg' ? '20px' : '11px';
      return '<span style="font-size:' + fs + ';font-weight:700;">' + esc(i) + '</span>';
    }

    function ava(p, cl, ti, pi, sz) {
      var o = cl ? ' onclick="upPhoto(' + ti + ',' + pi + ')"' : '';
      var cls = sz === 'lg' ? 'player-avatar-lg' : 'player-avatar-sm';
      if (p && p.photo && p.photo.length > 100) return '<div class="' + cls + '"' + o + '><img src="' + p.photo + '" style="width:100%;height:100%;object-fit:cover;"></div>';
      return '<div class="' + cls + '"' + o + '>' + esc((p&&p.nick)?p.nick[0].toUpperCase():'?') + '</div>';
    }

    function gs(n) {
      var s = { m:0, k:0, d:0, a:0, kd:'0.00', r:'0.00', kpr:'0.00', dpr:'0.00', apr:'0.00' };
      for (var i = 0; i < DB.matches.length; i++) {
        var m = DB.matches[i]; if (m.stats) for (var j = 0; j < m.stats.length; j++) if (m.stats[j].p === n) { s.m++; s.k += m.stats[j].k||0; s.d += m.stats[j].d||0; s.a += m.stats[j].a||0; }
      }
      if (s.m > 0) {
        s.kd = (s.k/Math.max(1,s.d)).toFixed(2);
        s.kpr = (s.k/s.m).toFixed(2);
        s.dpr = (s.d/s.m).toFixed(2);
        s.apr = (s.a/s.m).toFixed(2);
        s.r = Math.max(0,((s.k+0.7*s.a-0.3*s.d)/s.m/2)).toFixed(2);
      }
      return s;
    }

      currentPage = p;
      document.querySelectorAll('.page').forEach(function(x){ x.classList.remove('active'); });

      document.getElementById('p-' + p).classList.add('active');
      var btn = document.querySelector('[data-page="' + p + '"]');
      if (btn) btn.classList.add('active');
      
      if (p === 'rating') rating();
      if (p === 'matches') matches();
      if (p === 'tournaments') tournaments();
      if (p === 'stats') stats();
      if (p === 'admin') showAdminPage();
    }

    function matches() {

      else {
        var s1 = [], s2 = [];
        for (var j = 0; j < m.stats.length; j++) {
          var st = m.stats[j], e = { p: st.p, k: st.k||0, d: st.d||0, a: st.a||0, kd: (st.d>0?(st.k/st.d).toFixed(2):st.k.toFixed(2)) };
          if (t1&&t1.players&&t1.players.find(function(x){return x.nick===st.p;})) s1.push(e); else if (t2&&t2.players&&t2.players.find(function(x){return x.nick===st.p;})) s2.push(e);

        for (var k = 0; k < s1.length; k++) h += '<tr><td>' + esc(s1[k].p) + '</td><td>' + s1[k].k + '</td><td>' + s1[k].d + '</td><td>' + s1[k].a + '</td><td class="highlight">' + s1[k].kd + '</td></tr>';
        h += '</table></div>';

        for (var l = 0; l < s2.length; l++) h += '<tr><td>' + esc(s2[l].p) + '</td><td>' + s2[l].k + '</td><td>' + s2[l].d + '</td><td>' + s2[l].a + '</td><td class="highlight">' + s2[l].kd + '</td></tr>';
        h += '</table></div></div></div>';
      }
      document.getElementById('match-view').innerHTML = h;

    function upLogo(i) { upload = { t: 'logo', i: i }; document.getElementById('fileInput').click(); }

    document.getElementById('fileInput').addEventListener('change', function(e) {
      if (!upload || !admin) return; var f = e.target.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function(ev) {
        if (upload.t === 'logo') DB.teams[upload.i].logo = ev.target.result;
        else if (upload.t === 'photo') DB.teams[upload.i].players[upload.p].photo = ev.target.result;
        save(); buildAT(); buildAR(); rating(); upload = null;
      };
      r.readAsDataURL(f); e.target.value = '';
    });

    function buildAT() {
      if (!admin) return; var h = '';
      for (var i = 0; i < DB.teams.length; i++) {
        var t = DB.teams[i];
        h += '<div style="background:var(--bg);padding:8px;border-radius:5px;margin-bottom:6px;border:1px solid var(--border);">';
        h += '<div style="display:flex;align-items:center;gap:8px;"><div class="team-logo" onclick="upLogo(' + i + ')" style="cursor:pointer;width:32px;height:32px;">' + logo(t) + '</div>';
        h += '<input value="' + esc(t.name) + '" onchange="uf(' + i + ',\'name\',this.value)" style="flex:2;margin:0;padding:6px;">';
        h += '<input value="' + esc(t.region) + '" onchange="uf(' + i + ',\'region\',this.value)" style="width:50px;margin:0;padding:6px;">';
        h += '<input type="number" value="' + t.points + '" onchange="uf(' + i + ',\'points\',parseInt(this.value)||0)" style="width:60px;margin:0;padding:6px;"></div>';

      }
      document.getElementById('admin-teams').innerHTML = h;
    }

    function uf(i,f,v) { DB.teams[i][f] = (f==='points'?parseInt(v)||0:v); save(); rating(); }
    function mu(i) { if(i<=0)return; var t=DB.teams[i];DB.teams[i]=DB.teams[i-1];DB.teams[i-1]=t;save();ra(); }
    function md(i) { if(i>=DB.teams.length-1)return; var t=DB.teams[i];DB.teams[i]=DB.teams[i+1];DB.teams[i+1]=t;save();ra(); }
    function rt(i) { if(DB.teams.length<=1)return; if(confirm('Удалить '+DB.teams[i].name+'?')){DB.teams.splice(i,1);save();ra();} }
    function ra() { rating(); buildAT(); buildAR(); us(); uss(); }

    function buildAR() {
      if (!admin) return; var h = '';
      for (var i = 0; i < DB.teams.length; i++) {
        var t = DB.teams[i]; if (!t.players) t.players = [];
        h += '<div style="background:var(--bg);padding:8px;border-radius:5px;margin-bottom:6px;border:1px solid var(--border);">';
        h += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;"><b style="font-size:12px;">' + esc(t.name) + '</b><button class="btn btn-green btn-xs" onclick="ap(' + i + ')">+ Игрок</button></div>';
        for (var p = 0; p < t.players.length; p++) {
          var pl = t.players[p];
          h += '<div style="display:flex;gap:4px;align-items:center;margin-top:4px;background:var(--bg2);padding:4px;border-radius:3px;">' + ava(pl,true,i,p,'sm') + '<input value="' + esc(pl.nick) + '" onchange="up(' + i + ',' + p + ',\'nick\',this.value)" style="flex:2;margin:0;padding:5px;font-size:11px;"><input value="' + esc(pl.role) + '" onchange="up(' + i + ',' + p + ',\'role\',this.value)" style="flex:1;margin:0;padding:5px;font-size:11px;"><button class="btn btn-red btn-xs" onclick="dp(' + i + ',' + p + ')">✕</button></div>';
        }
        h += '</div>';
      }
      document.getElementById('admin-rosters').innerHTML = h;
    }

    function ap(i) { DB.teams[i].players.push({nick:'Игрок',role:'Роль',photo:''}); save(); buildAR(); }
    function up(i,p,f,v) { DB.teams[i].players[p][f] = v; save(); }
    function dp(i,p) { DB.teams[i].players.splice(p,1); save(); buildAR(); }

    function us() { var o = ''; for (var i = 0; i < DB.teams.length; i++) o += '<option>' + esc(DB.teams[i].name) + '</option>'; document.getElementById('mt1').innerHTML = o; document.getElementById('mt2').innerHTML = o; }

    function uss() {
      var s = document.getElementById('sm'), o = '<option value="">Выберите матч...</option>';
      for (var i = DB.matches.length-1; i >= 0; i--) o += '<option value="' + i + '">' + esc(DB.matches[i].t1) + ' vs ' + esc(DB.matches[i].t2) + '</option>';
      s.innerHTML = o;
      s.onchange = function() { bsf(parseInt(this.value)); };
    }

    function bsf(mi) {
      if (isNaN(mi)) { document.getElementById('sf').innerHTML = ''; return; }
      var m = DB.matches[mi]; if (!m.stats) m.stats = [];
      var h = '<div style="margin-top:8px;font-size:11px;color:var(--text3);">' + esc(m.t1) + ' vs ' + esc(m.t2) + '</div>';
      if (m.stats.length) { h += '<div style="font-size:10px;color:var(--text3);margin:4px 0;">Текущая статистика:</div>'; for (var i = 0; i < m.stats.length; i++) h += '<div style="font-size:10px;color:#aaa;">' + esc(m.stats[i].p) + ': K' + m.stats[i].k + ' D' + m.stats[i].d + ' A' + (m.stats[i].a||0) + '</div>'; }
      h += '<select id="sp" style="margin-top:5px;"><option value="">Выберите игрока...</option>';
      var t1 = ft(m.t1), t2 = ft(m.t2);
      if (t1&&t1.players) for (var j=0;j<t1.players.length;j++) h += '<option>' + esc(t1.players[j].nick) + '</option>';
      if (t2&&t2.players) for (var k=0;k<t2.players.length;k++) h += '<option>' + esc(t2.players[k].nick) + '</option>';
      h += '</select><div class="row"><input id="sk" type="number" placeholder="K" value="0"><input id="sd" type="number" placeholder="D" value="0"><input id="sa" type="number" placeholder="A" value="0"></div>';
      h += '<button class="btn btn-green btn-sm" onclick="ss(' + mi + ')">Сохранить статистику</button>';
      document.getElementById('sf').innerHTML = h;
    }

    function ss(mi) {
      var p = document.getElementById('sp').value, k = parseInt(document.getElementById('sk').value)||0, d = parseInt(document.getElementById('sd').value)||0, a = parseInt(document.getElementById('sa').value)||0;
      if (!p) return;
      if (!DB.matches[mi].stats) DB.matches[mi].stats = [];
      for (var i = 0; i < DB.matches[mi].stats.length; i++) { if (DB.matches[mi].stats[i].p === p) { DB.matches[mi].stats[i] = {p:p,k:k,d:d,a:a}; save(); bsf(mi); matches(); return; } }
      DB.matches[mi].stats.push({p:p,k:k,d:d,a:a}); save(); bsf(mi); matches();
    }

    function addTeam() {
      var n = document.getElementById('an').value.trim(); if (!n) return;
      DB.teams.push({name:n,region:document.getElementById('ar').value.trim()||'EU',points:parseInt(document.getElementById('ap').value)||500,logo:'',players:[]});
      document.getElementById('an').value = ''; save(); ra();
    }

    function addMatch() {
      DB.matches.push({t1:document.getElementById('mt1').value,t2:document.getElementById('mt2').value,score:document.getElementById('ms').value.trim()||'0:0',event:document.getElementById('me').value.trim()||'Турнир',date:new Date().toLocaleDateString('ru-RU'),stats:[]});
      document.getElementById('ms').value = ''; document.getElementById('me').value = ''; save(); matches(); uss();
    }

    function addTournament() {
      var n = document.getElementById('tn').value.trim(); if (!n) return;
      var ps = document.querySelectorAll('#pt .po'), pteams = [];
      for (var k = 0; k < ps.length; k++) if (ps[k].value.trim()) pteams.push(ps[k].value.trim());
      var t = { name:n, type:'playoff', bracket:[] };
      if (pteams.length >= 2) {
        var r1 = []; for (var x = 0; x < pteams.length; x += 2) if (pteams[x] && pteams[x+1]) r1.push({t1:pteams[x],t2:pteams[x+1],s:'',w:0});
        var r2 = []; for (var y = 0; y < Math.ceil(r1.length/2); y++) r2.push({t1:'',t2:'',s:'',w:0});
        var r3 = [{t1:'',t2:'',s:'',w:0}];
        t.bracket = r1.length > 2 ? [r1, r2, r3] : r1.length > 1 ? [r1, r3] : [r3];
      }
      DB.tournaments.push(t); document.getElementById('tn').value = '';
      var inputs = document.querySelectorAll('#pt .po'); for (var z = 0; z < inputs.length; z++) inputs[z].value = '';
      save(); tournaments();
    }

    function showAdminPage() { buildAT(); buildAR(); us(); uss(); }

    async function init() {
      if (localStorage.getItem('mltv_ad_v3') === '1') admin = true;
      await load();
      rating(); matches(); tournaments();
    }
    init();
  </script>
</body>
</html>
