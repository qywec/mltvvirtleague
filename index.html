<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>MLTV - CS2 Рейтинг</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: #0a0a0f;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 10px;
      padding-bottom: 30px;
    }

    .header {
      background: #1a1a2e;
      padding: 15px;
      border-radius: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .logo-text { font-size: 24px; font-weight: bold; color: #ff9500; cursor: pointer; }

    button {
      background: #ff9500;
      color: #000;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      margin: 2px;
      min-height: 40px;
    }

    button.red { background: #cc0000; color: #fff; }
    button.green { background: #00aa00; color: #fff; }
    button.blue { background: #0066cc; color: #fff; }

    .tabs {
      display: flex;
      gap: 5px;
      margin-bottom: 15px;
    }

    .tabs button {
      flex: 1;
      background: #1a1a2e;
      color: #aaa;
    }

    .tabs button.active-tab { background: #ff9500; color: #000; }

    .page { display: none; }
    .page.show-page { display: block; }

    .card {
      background: #1a1a2e;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 8px;
    }

    .team-row {
      background: #1a1a2e;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .rank-num {
      width: 35px;
      height: 35px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      background: #333;
      flex-shrink: 0;
    }

    .team-row:nth-child(1) .rank-num { background: #ff9500; color: #000; }
    .team-row:nth-child(2) .rank-num { background: #c0c0c0; color: #000; }
    .team-row:nth-child(3) .rank-num { background: #cd7f32; color: #000; }

    .team-logo {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: #333;
      flex-shrink: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .team-logo img { width: 100%; height: 100%; object-fit: cover; }

    .team-logo-sm {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: #333;
      flex-shrink: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .team-logo-sm img { width: 100%; height: 100%; object-fit: cover; }

    .team-info { flex: 1; min-width: 0; }
    .team-name-text { font-weight: bold; font-size: 16px; }
    .team-region-text { font-size: 12px; color: #999; }
    .team-points-text { color: #ff9500; font-weight: bold; flex-shrink: 0; }

    .login-box {
      background: #1a1a2e;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
    }

    .login-box input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      background: #0a0a1f;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      font-size: 16px;
      text-align: center;
    }

    .admin-panel {
      background: #1a1a2e;
      padding: 15px;
      border-radius: 15px;
      border: 2px solid #ff9500;
    }

    h3 { color: #ff9500; margin: 15px 0 10px 0; }
    h4 { color: #ddd; margin: 12px 0 6px 0; }

    input, select {
      width: 100%;
      padding: 10px;
      margin: 4px 0;
      background: #0a0a1f;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
    }

    .row-inputs { display: flex; gap: 5px; }
    .row-inputs input { flex: 1; }

    .player-box {
      background: #0a0a1f;
      padding: 10px;
      border-radius: 10px;
      margin: 6px 0;
    }

    .player-top { display: flex; align-items: center; gap: 10px; }

    .player-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #333;
      flex-shrink: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .player-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .back-link { color: #ff9500; font-size: 16px; margin-bottom: 15px; display: inline-block; cursor: pointer; }

    .logo-big {
      width: 80px;
      height: 80px;
      border-radius: 15px;
      background: #333;
      margin: 0 auto 10px auto;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-big img { width: 100%; height: 100%; object-fit: cover; }

    input[type="file"] { display: none; }

    .hint-text { font-size: 11px; color: #888; text-align: center; margin: 5px 0; }

    .admin-logo-preview {
      width: 50px;
      height: 50px;
      border-radius: 10px;
      background: #333;
      margin: 8px auto;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .admin-logo-preview img { width: 100%; height: 100%; object-fit: cover; }

    .stats-table {
      width: 100%;
      border-collapse: collapse;
      margin: 10px 0;
      font-size: 13px;
    }

    .stats-table th, .stats-table td {
      padding: 6px 8px;
      border: 1px solid #333;
      text-align: center;
    }

    .stats-table th { background: #1a1a2e; color: #ff9500; }

    .bracket-round {
      background: #1a1a2e;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 8px;
    }

    .bracket-round h4 { color: #ff9500; margin-bottom: 6px; }

    .bracket-match {
      background: #0a0a1f;
      padding: 8px;
      border-radius: 8px;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }

    .bracket-team {
      flex: 1;
      padding: 5px;
      border-radius: 5px;
      text-align: center;
      font-weight: bold;
    }

    .winner { background: #1a3a1a; border: 1px solid #4caf50; }

    .bracket-score {
      font-weight: bold;
      color: #ff9500;
      min-width: 30px;
      text-align: center;
    }

    .group-box {
      background: #0a0a1f;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .match-stats-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      padding: 4px 0;
      border-bottom: 1px solid #222;
    }
  </style>
</head>
<body>

  <input type="file" accept="image/*" id="hiddenFileInput" style="display:none;">

  <div class="header">
    <span class="logo-text" onclick="showRating()">MLTV</span>
    <button onclick="openAdmin()">⚙️ Админ</button>
  </div>

  <div class="tabs">
    <button id="tab-rating" class="active-tab" onclick="showRating()">Рейтинг</button>
    <button id="tab-matches" onclick="showMatches()">Матчи</button>
    <button id="tab-tournaments" onclick="showTournaments()">Турниры</button>
    <button id="tab-stats" onclick="showStats()">Статистика</button>
  </div>

  <!-- СТРАНИЦЫ -->
  <div id="page-login" class="page">
    <div class="login-box">
      <h3>🔐 Вход</h3>
      <input type="password" id="admin-password" placeholder="Пароль">
      <button onclick="login()" style="width:100%;">Войти</button>
      <button onclick="showRating()" style="width:100%;background:#555;color:#fff;margin-top:5px;">Отмена</button>
    </div>
  </div>

  <div id="page-rating" class="page show-page"><div id="rating-container"></div></div>
  <div id="page-matches" class="page"><div id="matches-container"></div></div>
  <div id="page-tournaments" class="page"><div id="tournaments-container"></div></div>
  <div id="page-tournament" class="page">
    <span class="back-link" onclick="showTournaments()">← К турнирам</span>
    <div id="tournament-content"></div>
  </div>
  <div id="page-match" class="page">
    <span class="back-link" onclick="showMatches()">← К матчам</span>
    <div id="match-content"></div>
  </div>
  <div id="page-stats" class="page"><div id="stats-container"></div></div>
  <div id="page-team" class="page">
    <span class="back-link" onclick="showRating()">← Назад</span>
    <div id="team-content"></div>
  </div>
  <div id="page-admin" class="page">
    <div class="admin-panel">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <h3>🛠️ Админ</h3>
        <button onclick="logout()" style="background:#555;color:#fff;font-size:11px;padding:6px 10px;min-height:auto;">Выйти</button>
      </div>

      <h4>➕ Команда</h4>
      <div class="row-inputs"><input id="add-name" placeholder="Название"><input id="add-region" placeholder="Регион" value="EU"></div>
      <input id="add-points" type="number" placeholder="Очки" value="500">
      <button onclick="addTeam()">Добавить</button>

      <h4>📋 Команды</h4>
      <div id="admin-teams"></div>

      <h4>👥 Составы</h4>
      <div id="admin-rosters"></div>

      <h4>🎮 Матч</h4>
      <select id="m-t1"></select>
      <select id="m-t2"></select>
      <div class="row-inputs"><input id="m-score" placeholder="Счёт (16:14)"><input id="m-event" placeholder="Турнир"></div>
      <button onclick="addMatch()">Добавить матч</button>

      <h4>📊 Статистика матча</h4>
      <select id="stats-match"></select>
      <div id="stats-form"></div>

      <h4>📅 Турнир</h4>
      <input id="t-name" placeholder="Название турнира">
      <select id="t-type">
        <option value="groups">Групповой этап + Плей-офф</option>
        <option value="playoff">Только Плей-офф</option>
      </select>
      <div id="t-groups">
        <h4>Группы</h4>
        <div id="groups-container">
          <div class="group-box">
            <b>Группа A</b>
            <input class="g-team" placeholder="Команда 1">
            <input class="g-team" placeholder="Команда 2">
            <input class="g-team" placeholder="Команда 3">
            <input class="g-team" placeholder="Команда 4">
          </div>
        </div>
        <button onclick="addGroup()" class="blue">+ Группа</button>
      </div>
      <h4>Плей-офф (8 команд)</h4>
      <div id="playoff-teams">
        <div class="row-inputs"><input class="p-team" placeholder="1"><input class="p-team" placeholder="2"></div>
        <div class="row-inputs"><input class="p-team" placeholder="3"><input class="p-team" placeholder="4"></div>
        <div class="row-inputs"><input class="p-team" placeholder="5"><input class="p-team" placeholder="6"></div>
        <div class="row-inputs"><input class="p-team" placeholder="7"><input class="p-team" placeholder="8"></div>
      </div>
      <button onclick="addTournament()">Создать турнир</button>
    </div>
  </div>

  <script>
    var PASSWORD = 'mltv2026';
    var SUPABASE_URL = 'https://thlsltelqegxzpoptldd.supabase.co';
    var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRobHNsdGVscWVneHpwb3B0bGRkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0MjExNDcsImV4cCI6MjEwMDk5NzE0N30.RXOkkQxZ8CWkmJZZRZvXi0J4IVyLwG5LCIpi3TXj8z0';

    var DB = { teams: [], matches: [], tournaments: [] };
    var isAdmin = false;
    var upload = null;

    function def() {
      DB.teams = [
        { name:"Falcons", region:"EU", points:1000, logo:"", players:[] },
        { name:"Vitality", region:"EU", points:982, logo:"", players:[] },
        { name:"Spirit", region:"EU", points:965, logo:"", players:[] },
        { name:"FURIA", region:"SA", points:912, logo:"", players:[] },
        { name:"Natus Vincere", region:"EU", points:894, logo:"", players:[] },
        { name:"9z", region:"SA", points:870, logo:"", players:[] },
        { name:"BetBoom", region:"EU", points:845, logo:"", players:[] },
        { name:"Aurora", region:"EU", points:822, logo:"", players:[] },
        { name:"G2", region:"EU", points:798, logo:"", players:[] },
        { name:"MOUZ", region:"EU", points:775, logo:"", players:[] },
        { name:"Legacy", region:"NA", points:752, logo:"", players:[] },
        { name:"The MongolZ", region:"AS", points:731, logo:"", players:[] },
        { name:"FaZe", region:"EU", points:708, logo:"", players:[] },
        { name:"FUT", region:"EU", points:684, logo:"", players:[] },
        { name:"Astralis", region:"EU", points:661, logo:"", players:[] },
        { name:"B8", region:"EU", points:642, logo:"", players:[] },
        { name:"PARIVISION", region:"EU", points:620, logo:"", players:[] },
        { name:"paiN", region:"SA", points:598, logo:"", players:[] },
        { name:"GamerLegion", region:"EU", points:572, logo:"", players:[] },
        { name:"Liquid", region:"NA", points:555, logo:"", players:[] }
      ];
      DB.matches = [];
      DB.tournaments = [];
    }

    async function load() {
      try {
        var r = await fetch(SUPABASE_URL + '/rest/v1/data?id=eq.1', {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
        });
        if (r.ok) {
          var d = await r.json();
          if (d[0] && d[0].content) {
            var p = JSON.parse(d[0].content);
            if (p.teams && p.teams.length > 0) { DB = p; return; }
          }
        }
      } catch(e) {}
      var s = localStorage.getItem('mltv_v2');
      if (s) { try { var p = JSON.parse(s); if (p.teams && p.teams.length > 0) { DB = p; return; } } catch(e) {} }
      def(); save();
    }

    function save() {
      var j = JSON.stringify(DB);
      localStorage.setItem('mltv_v2', j);
      if (isAdmin) {
        fetch(SUPABASE_URL + '/rest/v1/data?id=eq.1', {
          method: 'PATCH',
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
          body: JSON.stringify({ content: j })
        }).catch(function(){});
      }
    }

    setInterval(async function() {
      try {
        var r = await fetch(SUPABASE_URL + '/rest/v1/data?id=eq.1', {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
        });
        if (r.ok) {
          var d = await r.json();
          if (d[0] && d[0].content) {
            var p = JSON.parse(d[0].content);
            if (JSON.stringify(p) !== JSON.stringify(DB)) { DB = p; refreshView(); }
          }
        }
      } catch(e) {}
    }, 5000);

    function refreshView() {
      if (document.getElementById('page-rating').classList.contains('show-page')) buildRating();
      if (document.getElementById('page-matches').classList.contains('show-page')) buildMatches();
      if (document.getElementById('page-tournaments').classList.contains('show-page')) buildTournaments();
      if (document.getElementById('page-stats').classList.contains('show-page')) buildStats();
    }

    function esc(s) { return s ? String(s).replace(/</g,'&lt;').replace(/>/g,'&gt;') : ''; }

    function logo(t, s) {
      if (t && t.logo && t.logo.length > 100) return '<img src="' + t.logo + '" style="width:100%;height:100%;object-fit:cover;">';
      var i = (t && t.name) ? t.name.substring(0,2).toUpperCase() : '??';
      var fs = s === 'big' ? '26px' : '12px';
      return '<span style="font-size:' + fs + ';font-weight:bold;">' + esc(i) + '</span>';
    }

    function ava(p, cl, ti, pi) {
      var c = cl ? 'player-avatar' : 'player-avatar';
      var o = cl ? ' onclick="upPhoto(' + ti + ',' + pi + ')"' : '';
      if (p && p.photo && p.photo.length > 100) return '<div class="' + c + '"' + o + '><img src="' + p.photo + '" style="width:100%;height:100%;object-fit:cover;"></div>';
      var i = (p && p.nick) ? p.nick[0].toUpperCase() : '?';
      return '<div class="' + c + '"' + o + '><span style="font-size:16px;">' + esc(i) + '</span></div>';
    }

    function hide() {
      var ps = ['page-rating','page-matches','page-tournaments','page-tournament','page-match','page-stats','page-team','page-admin','page-login'];
      for (var i = 0; i < ps.length; i++) document.getElementById(ps[i]).classList.remove('show-page');
      var ts = ['tab-rating','tab-matches','tab-tournaments','tab-stats'];
      for (var j = 0; j < ts.length; j++) document.getElementById(ts[j]).classList.remove('active-tab');
    }

    function showRating() { hide(); document.getElementById('page-rating').classList.add('show-page'); document.getElementById('tab-rating').classList.add('active-tab'); buildRating(); }
    function showMatches() { hide(); document.getElementById('page-matches').classList.add('show-page'); document.getElementById('tab-matches').classList.add('active-tab'); buildMatches(); }
    function showTournaments() { hide(); document.getElementById('page-tournaments').classList.add('show-page'); document.getElementById('tab-tournaments').classList.add('active-tab'); buildTournaments(); }
    function showStats() { hide(); document.getElementById('page-stats').classList.add('show-page'); document.getElementById('tab-stats').classList.add('active-tab'); buildStats(); }
    function showTeam(i) { hide(); document.getElementById('page-team').classList.add('show-page'); buildTeam(i); }
    function showTournament(i) { hide(); document.getElementById('page-tournament').classList.add('show-page'); buildTournament(i); }
    function showMatch(i) { hide(); document.getElementById('page-match').classList.add('show-page'); buildMatch(i); }

    function openAdmin() { if (isAdmin) { showAdmin(); return; } hide(); document.getElementById('page-login').classList.add('show-page'); }
    function login() { if (document.getElementById('admin-password').value === PASSWORD) { isAdmin = true; localStorage.setItem('mltv_a', '1'); showAdmin(); } else alert('Неверный пароль!'); }
    function logout() { isAdmin = false; localStorage.removeItem('mltv_a'); showRating(); }
    function showAdmin() { hide(); document.getElementById('page-admin').classList.add('show-page'); buildAdminTeams(); buildAdminRosters(); updateSelects(); updateStatsSelect(); }

    function getStats(n) {
      var s = { m: 0, k: 0, d: 0, a: 0, kd: '0.00', r: '0.00' };
      for (var i = 0; i < DB.matches.length; i++) {
        var m = DB.matches[i];
        if (m.stats) for (var j = 0; j < m.stats.length; j++) if (m.stats[j].p === n) { s.m++; s.k += m.stats[j].k||0; s.d += m.stats[j].d||0; s.a += m.stats[j].a||0; }
      }
      if (s.m > 0) { s.kd = (s.k/Math.max(1,s.d)).toFixed(2); s.r = Math.max(0,((s.k+0.7*s.a-0.3*s.d)/s.m/2)).toFixed(2); }
      return s;
    }

    function findTeam(n) { for (var i = 0; i < DB.teams.length; i++) if (DB.teams[i].name === n) return DB.teams[i]; return null; }

    function buildRating() {
      DB.teams.sort(function(a,b){ return b.points - a.points; });
      var h = '';
      for (var i = 0; i < DB.teams.length; i++) {
        var t = DB.teams[i];
        h += '<div class="team-row" onclick="showTeam(' + i + ')"><div class="rank-num">#' + (i+1) + '</div><div class="team-logo">' + logo(t) + '</div><div class="team-info"><div class="team-name-text">' + esc(t.name) + '</div><div class="team-region-text">' + esc(t.region) + '</div></div><div class="team-points-text">' + t.points + '</div></div>';
      }
      document.getElementById('rating-container').innerHTML = h;
    }

    function buildTeam(i) {
      var t = DB.teams[i]; if (!t) return; if (!t.players) t.players = [];
      var h = '<div class="logo-big">' + logo(t,'big') + '</div><h2 style="text-align:center;">' + esc(t.name) + '</h2><p style="text-align:center;color:#999;">' + esc(t.region) + ' | Очки: ' + t.points + '</p><h3>Состав:</h3>';
      if (!t.players.length) h += '<p style="color:#666;">Нет игроков</p>';
      else for (var p = 0; p < t.players.length; p++) {
        var pl = t.players[p], s = getStats(pl.nick);
        h += '<div class="player-box"><div class="player-top">' + ava(pl,false,i,p) + '<div style="flex:1;"><b>' + esc(pl.nick) + '</b><br><span style="color:#999;">' + esc(pl.role) + '</span></div><div style="text-align:right;font-size:11px;color:#ff9500;">М: ' + s.m + '<br>K/D: ' + s.kd + '<br>Рейтинг: ' + s.r + '</div></div></div>';
      }
      document.getElementById('team-content').innerHTML = h;
    }

    function buildMatches() {
      var h = '';
      if (!DB.matches.length) h = '<p style="color:#999;">Матчей нет</p>';
      else for (var i = DB.matches.length-1; i >= 0; i--) {
        var m = DB.matches[i], t1 = findTeam(m.t1), t2 = findTeam(m.t2);
        h += '<div class="card" onclick="showMatch(' + i + ')" style="cursor:pointer;">';
        h += '<div style="color:#ff9500;font-size:11px;text-align:center;">' + esc(m.event||'Турнир') + ' • ' + esc(m.date) + '</div>';
        h += '<div style="display:flex;align-items:center;gap:8px;margin:6px 0;">';
        h += '<div style="flex:1;display:flex;align-items:center;gap:6px;font-weight:bold;"><div class="team-logo-sm">' + logo(t1) + '</div>' + esc(m.t1) + '</div>';
        h += '<div style="font-size:18px;font-weight:bold;">' + esc(m.score) + '</div>';
        h += '<div style="flex:1;display:flex;align-items:center;gap:6px;font-weight:bold;justify-content:flex-end;text-align:right;">' + esc(m.t2) + '<div class="team-logo-sm">' + logo(t2) + '</div></div>';
        h += '</div></div>';
      }
      document.getElementById('matches-container').innerHTML = h;
    }

    function buildMatch(i) {
      var m = DB.matches[i]; if (!m) return;
      var t1 = findTeam(m.t1), t2 = findTeam(m.t2);
      var h = '<h2 style="text-align:center;">' + esc(m.t1) + ' vs ' + esc(m.t2) + '</h2>';
      h += '<p style="text-align:center;color:#999;">' + esc(m.event||'Турнир') + ' • ' + esc(m.date) + '</p>';
      h += '<div style="text-align:center;font-size:36px;font-weight:bold;margin:15px 0;">' + esc(m.score) + '</div>';
      
      h += '<h3>📊 Статистика игроков</h3>';
      if (!m.stats || !m.stats.length) { h += '<p style="color:#666;">Нет статистики</p>'; }
      else {
        var s1 = [], s2 = [];
        for (var j = 0; j < m.stats.length; j++) {
          var st = m.stats[j];
          var entry = { p: st.p, k: st.k||0, d: st.d||0, a: st.a||0, kd: (st.d>0?(st.k/st.d).toFixed(2):st.k.toFixed(2)) };
          var p1 = t1 && t1.players ? t1.players.find(function(x){ return x.nick === st.p; }) : null;
          var p2 = t2 && t2.players ? t2.players.find(function(x){ return x.nick === st.p; }) : null;
          if (p1) s1.push(entry); else if (p2) s2.push(entry);
        }
        
        h += '<div style="display:flex;gap:10px;">';
        h += '<div style="flex:1;"><h4>' + esc(m.t1) + '</h4><table class="stats-table"><tr><th>Игрок</th><th>K</th><th>D</th><th>A</th><th>K/D</th></tr>';
        for (var k = 0; k < s1.length; k++) h += '<tr><td>' + esc(s1[k].p) + '</td><td>' + s1[k].k + '</td><td>' + s1[k].d + '</td><td>' + s1[k].a + '</td><td>' + s1[k].kd + '</td></tr>';
        h += '</table></div>';
        
        h += '<div style="flex:1;"><h4>' + esc(m.t2) + '</h4><table class="stats-table"><tr><th>Игрок</th><th>K</th><th>D</th><th>A</th><th>K/D</th></tr>';
        for (var l = 0; l < s2.length; l++) h += '<tr><td>' + esc(s2[l].p) + '</td><td>' + s2[l].k + '</td><td>' + s2[l].d + '</td><td>' + s2[l].a + '</td><td>' + s2[l].kd + '</td></tr>';
        h += '</table></div>';
        h += '</div>';
      }
      document.getElementById('match-content').innerHTML = h;
    }

    function buildTournaments() {
      var h = '';
      if (!DB.tournaments.length) h = '<p style="color:#999;">Турниров нет</p>';
      else for (var i = 0; i < DB.tournaments.length; i++) {
        var t = DB.tournaments[i];
        h += '<div class="card" onclick="showTournament(' + i + ')" style="cursor:pointer;"><div style="font-weight:bold;">' + esc(t.name) + '</div><div style="color:#999;font-size:12px;">' + (t.type==='groups'?'Группы + Плей-офф':'Плей-офф') + '</div></div>';
      }
      document.getElementById('tournaments-container').innerHTML = h;
    }

    function buildTournament(i) {
      var t = DB.tournaments[i]; if (!t) return;
      var h = '<h2>' + esc(t.name) + '</h2>';
      
      if (t.groups && t.groups.length) {
        h += '<h3>📊 Групповой этап</h3>';
        for (var g = 0; g < t.groups.length; g++) {
          var gr = t.groups[g], letters = 'ABCDEFGH';
          h += '<div class="group-box"><h4>Группа ' + (letters[g]||'?') + '</h4>';
          h += '<table class="stats-table"><tr><th>#</th><th>Команда</th><th>Игры</th><th>W</th><th>Очки</th></tr>';
          if (gr.teams) for (var x = 0; x < gr.teams.length; x++) {
            var tm = gr.teams[x];
            h += '<tr><td>' + (x+1) + '</td><td>' + esc(tm.name) + '</td><td>' + (tm.p||0) + '</td><td>' + (tm.w||0) + '</td><td>' + (tm.pts||0) + '</td></tr>';
          }
          h += '</table></div>';
        }
      }
      
      if (t.bracket && t.bracket.length) {
        h += '<h3>🏆 Плей-офф</h3>';
        var rn = ['1/4 финала','1/2 финала','Финал'];
        for (var r = 0; r < t.bracket.length; r++) {
          var rd = t.bracket[r];
          h += '<div class="bracket-round"><h4>' + (rn[r]||'Раунд') + '</h4>';
          for (var m = 0; m < rd.length; m++) {
            var bm = rd[m];
            h += '<div class="bracket-match"><div class="bracket-team' + (bm.w===1?' winner':'') + '">' + esc(bm.t1||'TBD') + '</div><div class="bracket-score">' + esc(bm.s||'vs') + '</div><div class="bracket-team' + (bm.w===2?' winner':'') + '">' + esc(bm.t2||'TBD') + '</div></div>';
          }
          h += '</div>';
        }
      }
      
      // Матчи турнира
      var tms = DB.matches.filter(function(m){ return m.event === t.name; });
      if (tms.length) {
        h += '<h3>🎮 Матчи</h3>';
        for (var mi = tms.length-1; mi >= 0; mi--) {
          var tm = tms[mi];
          h += '<div class="card" onclick="showMatch(' + DB.matches.indexOf(tm) + ')" style="cursor:pointer;">';
          h += '<div style="display:flex;align-items:center;justify-content:space-between;font-weight:bold;">';
          h += '<span>' + esc(tm.t1) + '</span><span>' + esc(tm.score) + '</span><span>' + esc(tm.t2) + '</span>';
          h += '</div><div style="color:#666;font-size:11px;text-align:center;">' + esc(tm.date) + '</div></div>';
        }
      }
      
      document.getElementById('tournament-content').innerHTML = h;
    }

    function buildStats() {
      var all = [];
      for (var i = 0; i < DB.teams.length; i++) for (var j = 0; j < DB.teams[i].players.length; j++) {
        var s = getStats(DB.teams[i].players[j].nick);
        if (s.m > 0) all.push({ n: DB.teams[i].players[j].nick, t: DB.teams[i].name, s: s });
      }
      all.sort(function(a,b){ return parseFloat(b.s.r)-parseFloat(a.s.r); });
      var h = '<h3>📊 Рейтинг игроков</h3>';
      if (!all.length) h += '<p style="color:#666;">Нет данных</p>';
      else {
        h += '<table class="stats-table"><tr><th>#</th><th>Игрок</th><th>Команда</th><th>М</th><th>K/D</th><th>Рейтинг</th></tr>';
        for (var k = 0; k < all.length; k++) h += '<tr><td>' + (k+1) + '</td><td>' + esc(all[k].n) + '</td><td>' + esc(all[k].t) + '</td><td>' + all[k].s.m + '</td><td>' + all[k].s.kd + '</td><td style="color:#ff9500;">' + all[k].s.r + '</td></tr>';
        h += '</table>';
      }
      document.getElementById('stats-container').innerHTML = h;
    }

    // АДМИНКА
    function upLogo(i) { upload = { t: 'logo', i: i }; document.getElementById('hiddenFileInput').click(); }
    function upPhoto(i,p) { upload = { t: 'photo', i: i, p: p }; document.getElementById('hiddenFileInput').click(); }

    document.getElementById('hiddenFileInput').addEventListener('change', function(e) {
      if (!upload || !isAdmin) return;
      var f = e.target.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function(ev) {
        if (upload.t === 'logo') DB.teams[upload.i].logo = ev.target.result;
        else if (upload.t === 'photo') DB.teams[upload.i].players[upload.p].photo = ev.target.result;
        save(); buildAdminTeams(); buildAdminRosters(); buildRating(); upload = null;
      };
      r.readAsDataURL(f); e.target.value = '';
    });

    function buildAdminTeams() {
      if (!isAdmin) return;
      var h = '';
      for (var i = 0; i < DB.teams.length; i++) {
        var t = DB.teams[i];
        h += '<div style="background:#0a0a1f;padding:10px;border-radius:10px;margin-bottom:8px;">';
        h += '<div class="admin-logo-preview" onclick="upLogo(' + i + ')">' + logo(t) + '</div>';
        h += '<div style="display:flex;gap:4px;align-items:center;"><span>#' + (i+1) + '</span>';
        h += '<input value="' + esc(t.name) + '" onchange="uf(' + i + ',\'name\',this.value)" style="flex:2;margin:0;padding:6px;">';
        h += '<input value="' + esc(t.region) + '" onchange="uf(' + i + ',\'region\',this.value)" style="width:50px;margin:0;padding:6px;">';
        h += '<input type="number" value="' + t.points + '" onchange="uf(' + i + ',\'points\',parseInt(this.value)||0)" style="width:65px;margin:0;padding:6px;"></div>';
        h += '<div style="display:flex;gap:3px;margin-top:4px;"><button onclick="mu(' + i + ')" style="flex:1;font-size:11px;padding:4px;">▲</button><button onclick="md(' + i + ')" style="flex:1;font-size:11px;padding:4px;">▼</button><button class="red" onclick="rt(' + i + ')" style="flex:1;font-size:11px;padding:4px;">✕</button></div></div>';
      }
      document.getElementById('admin-teams').innerHTML = h;
    }

    function uf(i,f,v) { DB.teams[i][f] = (f==='points'?parseInt(v)||0:v); save(); buildRating(); }
    function mu(i) { if(i<=0)return; var t=DB.teams[i];DB.teams[i]=DB.teams[i-1];DB.teams[i-1]=t;save();ra(); }
    function md(i) { if(i>=DB.teams.length-1)return; var t=DB.teams[i];DB.teams[i]=DB.teams[i+1];DB.teams[i+1]=t;save();ra(); }
    function rt(i) { if(DB.teams.length<=1)return; if(confirm('Удалить '+DB.teams[i].name+'?')){DB.teams.splice(i,1);save();ra();} }
    function ra() { buildRating(); buildAdminTeams(); buildAdminRosters(); updateSelects(); updateStatsSelect(); }

    function buildAdminRosters() {
      if (!isAdmin) return;
      var h = '';
      for (var i = 0; i < DB.teams.length; i++) {
        var t = DB.teams[i]; if (!t.players) t.players = [];
        h += '<div style="background:#0a0a1f;padding:10px;border-radius:10px;margin-bottom:8px;">';
        h += '<div style="display:flex;justify-content:space-between;"><b>' + esc(t.name) + '</b><button class="green" onclick="ap(' + i + ')" style="padding:5px 10px;font-size:11px;">+ Игрок</button></div>';
        for (var p = 0; p < t.players.length; p++) {
          var pl = t.players[p];
          h += '<div style="display:flex;gap:4px;align-items:center;margin-top:4px;background:#1a1a2e;padding:5px;border-radius:6px;">';
          h += ava(pl,true,i,p);
          h += '<input value="' + esc(pl.nick) + '" onchange="up(' + i + ',' + p + ',\'nick\',this.value)" style="flex:2;margin:0;padding:5px;">';
          h += '<input value="' + esc(pl.role) + '" onchange="up(' + i + ',' + p + ',\'role\',this.value)" style="flex:1;margin:0;padding:5px;">';
          h += '<button class="red" onclick="dp(' + i + ',' + p + ')" style="padding:3px 7px;font-size:11px;">✕</button></div>';
        }
        h += '</div>';
      }
      document.getElementById('admin-rosters').innerHTML = h;
    }

    function ap(i) { DB.teams[i].players.push({nick:'Игрок',role:'Роль',photo:''}); save(); buildAdminRosters(); }
    function up(i,p,f,v) { DB.teams[i].players[p][f] = v; save(); }
    function dp(i,p) { DB.teams[i].players.splice(p,1); save(); buildAdminRosters(); }

    function updateSelects() {
      var o = ''; for (var i = 0; i < DB.teams.length; i++) o += '<option>' + esc(DB.teams[i].name) + '</option>';
      document.getElementById('m-t1').innerHTML = o; document.getElementById('m-t2').innerHTML = o;
    }

    function updateStatsSelect() {
      var s = document.getElementById('stats-match'), o = '<option value="">Матч...</option>';
      for (var i = DB.matches.length-1; i >= 0; i--) o += '<option value="' + i + '">' + esc(DB.matches[i].t1) + ' vs ' + esc(DB.matches[i].t2) + '</option>';
      s.innerHTML = o;
      s.onchange = function() { buildStatsForm(parseInt(this.value)); };
    }

    function buildStatsForm(mi) {
      if (isNaN(mi)) { document.getElementById('stats-form').innerHTML = ''; return; }
      var m = DB.matches[mi]; if (!m.stats) m.stats = [];
      var h = '<h4>' + esc(m.t1) + ' vs ' + esc(m.t2) + '</h4>';
      if (m.stats.length) { for (var i = 0; i < m.stats.length; i++) h += '<div style="font-size:11px;color:#aaa;">' + esc(m.stats[i].p) + ': K' + m.stats[i].k + ' D' + m.stats[i].d + ' A' + (m.stats[i].a||0) + '</div>'; }
      h += '<select id="sp"><option value="">Игрок...</option>';
      var t1 = findTeam(m.t1), t2 = findTeam(m.t2);
      if (t1&&t1.players) for (var j=0;j<t1.players.length;j++) h += '<option>' + esc(t1.players[j].nick) + '</option>';
      if (t2&&t2.players) for (var k=0;k<t2.players.length;k++) h += '<option>' + esc(t2.players[k].nick) + '</option>';
      h += '</select><div class="row-inputs"><input id="sk" type="number" placeholder="K" value="0"><input id="sd" type="number" placeholder="D" value="0"><input id="sa" type="number" placeholder="A" value="0"></div>';
      h += '<button class="green" onclick="ss(' + mi + ')">Сохранить</button>';
      document.getElementById('stats-form').innerHTML = h;
    }

    function ss(mi) {
      var p = document.getElementById('sp').value, k = parseInt(document.getElementById('sk').value)||0, d = parseInt(document.getElementById('sd').value)||0, a = parseInt(document.getElementById('sa').value)||0;
      if (!p) return;
      if (!DB.matches[mi].stats) DB.matches[mi].stats = [];
      for (var i = 0; i < DB.matches[mi].stats.length; i++) { if (DB.matches[mi].stats[i].p === p) { DB.matches[mi].stats[i] = {p:p,k:k,d:d,a:a}; save(); buildStatsForm(mi); buildMatches(); return; } }
      DB.matches[mi].stats.push({p:p,k:k,d:d,a:a}); save(); buildStatsForm(mi); buildMatches();
    }

    function addTeam() {
      var n = document.getElementById('add-name').value.trim(); if (!n) return;
      DB.teams.push({name:n,region:document.getElementById('add-region').value.trim()||'EU',points:parseInt(document.getElementById('add-points').value)||500,logo:'',players:[]});
      document.getElementById('add-name').value = ''; save(); ra();
    }

    function addMatch() {
      DB.matches.push({t1:document.getElementById('m-t1').value,t2:document.getElementById('m-t2').value,score:document.getElementById('m-score').value.trim()||'0:0',event:document.getElementById('m-event').value.trim()||'Турнир',date:new Date().toLocaleDateString('ru-RU'),stats:[]});
      save(); buildMatches(); updateStatsSelect();
    }

    function addGroup() {
      var c = document.getElementById('groups-container'), n = c.querySelectorAll('.group-box').length, l = 'ABCDEFGH';
      var d = document.createElement('div'); d.className = 'group-box';
      d.innerHTML = '<b>Группа ' + (l[n]||'?') + '</b><input class="g-team" placeholder="Команда 1"><input class="g-team" placeholder="Команда 2"><input class="g-team" placeholder="Команда 3"><input class="g-team" placeholder="Команда 4">';
      c.appendChild(d);
    }

    function addTournament() {
      var n = document.getElementById('t-name').value.trim(); if (!n) return;
      var tp = document.getElementById('t-type').value, t = {name:n,type:tp,groups:[],bracket:[]};
      
      if (tp === 'groups') {
        var gs = document.querySelectorAll('#groups-container .group-box');
        for (var i = 0; i < gs.length; i++) {
          var ins = gs[i].querySelectorAll('.g-team'), tms = [];
          for (var j = 0; j < ins.length; j++) if (ins[j].value.trim()) tms.push({name:ins[j].value.trim(),p:0,w:0,pts:0});
          if (tms.length) t.groups.push({teams:tms});
        }
      }
      
      var ps = document.querySelectorAll('#playoff-teams .p-team'), pteams = [];
      for (var k = 0; k < ps.length; k++) if (ps[k].value.trim()) pteams.push(ps[k].value.trim());
      
      if (pteams.length >= 2) {
        var r1 = []; for (var x = 0; x < pteams.length; x += 2) if (pteams[x] && pteams[x+1]) r1.push({t1:pteams[x],t2:pteams[x+1],s:'',w:0});
        var r2 = []; for (var y = 0; y < r1.length/2; y++) r2.push({t1:'',t2:'',s:'',w:0});
        var r3 = [{t1:'',t2:'',s:'',w:0}];
        t.bracket = [r1,r2,r3];
      }
      
      DB.tournaments.push(t);
      document.getElementById('t-name').value = ''; save(); buildTournaments();
    }

    document.getElementById('t-type').addEventListener('change', function() {
      document.getElementById('t-groups').style.display = this.value === 'groups' ? 'block' : 'none';
    });

    async function init() {
      if (localStorage.getItem('mltv_a') === '1') isAdmin = true;
      await load(); buildRating(); buildMatches(); buildTournaments();
    }
    init();
  </script>
</body>
</html>
